<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Parte de Emergencia</title>

<link rel="stylesheet" href="formulario.css">

</head>

<body>

<div class="logo-header">
  <img src="logo.png" alt="Logo">
  <h2>📋 Parte de Emergencia</h2>
</div>

<form id="formParte" class="form-container">


<!-- ✅ DATOS GENERALES -->
<div class="bloque">
  <h3>📅 Datos Generales</h3>

  <div class="grid">

    <div>
      <label>Fecha</label>
      <input type="date" id="fecha">
    </div>

    <div>
      <label>Hora de Activación</label>
      <input type="time" id="horaActivacion">
    </div>

    <div>
      <label>Hora de Levantamiento</label>
      <input type="time" id="horaCierre">
    </div>

  </div>
</div>

<!-- ✅ EMERGENCIA -->
<div class="bloque">
  <h3>🚒 Emergencia</h3>

  <div class="grid">

    <div>
      <label>Tipo</label>
     <select id="tipo"></select>
    </div>

    <div>
      <label>Subtipo</label>
    <select id="subtipo"></select>
    </div>

  </div>

  <label>Descripción</label>
  <textarea id="descripcion"></textarea>
</div>

<!-- ✅ UBICACIÓN -->
<div class="bloque">
  <h3>📍 Ubicación</h3>

  <div class="grid">

    <div>
      <label>Lugar</label>
      <input type="text" id="lugar">
    </div>

    <div>
      <label>Comuna</label>
      <input type="text" id="comuna">
    </div>

    <div>
      <label>Faena</label>
      <select id="faena">
        <option value="">Seleccionar</option>
        <option>Los Bronces</option>
        <option>STP</option>
        <option>Las Tórtolas</option>
        <option>Ruta G21/245</option>
      </select>
    </div>

  </div>
</div>

<!-- ✅ AFECTACIÓN -->
<div class="bloque">
  <h3>🏢 Afectación</h3>

  <div class="grid">

    <div>
      <label>Empresa</label>
      <input type="text" id="empresa">
    </div>

    <div>
      <label>Impacto</label>
      <select id="impacto">
        <option value="">Seleccionar</option>
        <option>Operaciones</option>
        <option>Comunidad</option>
      </select>
    </div>

  </div>
</div>

<!-- ✅ RESPUESTA -->
<div class="bloque">
  <h3>🚑 Respuesta</h3>

  <div class="grid">

    <div>
      <label>Brigada</label>
      <input type="text" id="brigada">
    </div>

    <div>
      <label>Vehículo</label>
      <input type="text" id="vehiculo">
    </div>

    <div>
      <label>Ambulancia</label>
      <select id="ambulancia">
        <option value="">Seleccionar</option>
        <option>Si asiste</option>
        <option>No asiste</option>
      </select>
    </div>

  </div>

<div>
  <label>Servicio Médico</label>
  <input type="text" id="servicioMedico" readonly>

  <div>
  <label>Ambulancia Externa</label>
  <input type="text" id="ambulanciaExterna" placeholder="Ej: SAMU, ACHS">
</div>
  
</div>

  </div>

  <input type="text" id="otroServicio" placeholder="Especificar" style="display:none;">
</div>

<!-- ✅ ATENCIÓN -->
<div class="bloque">
  <h3>🏥 Atención</h3>

  <div class="grid">

    <div>
      <label>¿Existe atención?</label>
      <select id="existeAtencion">
        <option value="">Seleccionar</option>
        <option>SI</option>
        <option>NO</option>
      </select>
    </div>

    <div>
      <label>Cantidad de pacientes</label>
      <input type="number" id="pacientes">
    </div>

    <div>
      <label>Clave</label>
      <select id="clave"></select>
    </div>

    <div>
      <label>Tipo de Atención</label>
      <input type="text" id="tipoAtencion">
    </div>

    <div>
      <label>PUE</label>
      <select id="pue"></select>
    </div>

  </div>

  <label>Descripción PUE</label>
  <textarea id="descPue"></textarea>

</div>

<!-- ✅ CIERRE -->
<div class="bloque">
  <h3>🔐 Cierre</h3>

  <div class="grid">

    <div>
      <label>Anexo 3</label>
      <input type="text" id="anexo3">
    </div>

    <div>
      <label>Operador</label>
      <input type="text" id="operador">
    </div>

  </div>
</div>

<button type="submit" class="btnGuardar">💾 Guardar Parte</button>

</form>

<script type="module" src="formulario.js"></script>

</body>
</html>
