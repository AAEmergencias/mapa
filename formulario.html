<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parte de Emergencia</title>

<link rel="stylesheet" href="formulario.css">

</head>

<body>

<h2>📋 Parte de Emergencia</h2>

<form id="formParte" class="form-container">

  <!-- 🔧 BLOQUE 1 -->
  <div class="bloque">
    <h3>📅 Datos Generales</h3>

    <div class="grid">
      <input type="date" id="fecha">
      <input type="time" id="horaActivacion" placeholder="Hora Activación">
      <input type="time" id="horaCierre" placeholder="Hora Levantamiento">
    </div>
  </div>

  <!-- 🔥 BLOQUE 2 -->
  <div class="bloque">
    <h3>🚒 Emergencia</h3>

    <div class="grid">
      <input type="text" id="tipo" placeholder="Tipo">
      <input type="text" id="subtipo" placeholder="Subtipo">
    </div>

    <textarea id="descripcion" placeholder="Descripción"></textarea>
  </div>

  <!-- 📍 UBICACIÓN -->
  <div class="bloque">
    <h3>📍 Ubicación</h3>

    <div class="grid">
      <input type="text" id="lugar" placeholder="Lugar">
      <input type="text" id="comuna" placeholder="Comuna">
      <select id="faena">
  <option value="">Faena</option>
  <option>Los Bronces</option>
  <option>STP</option>
  <option>Las Tórtolas</option>
  <option>Ruta G21/245</option>
</select>
    </div>
  </div>

  <!-- 🏢 EMPRESA -->
  <div class="bloque">
    <h3>🏢 Afectación</h3>

    <div class="grid">
      <input type="text" id="empresa" placeholder="Empresa">
      <select id="impacto">
        <option value="">Impacto</option>
        <option value="Operaciones">Operaciones</option>
        <option value="Comunidad">Comunidad</option>
      </select>
    </div>
  </div>

  <!-- 🚑 RESPUESTA -->
  <div class="bloque">
    <h3>🚑 Respuesta</h3>

    <div class="grid">
      <input type="text" id="brigada" placeholder="Brigada">
      <input type="text" id="vehiculo" placeholder="Vehículo">
     <select id="ambulancia">
  <option value="">Ambulancia</option>
  <option>Si asiste</option>
  <option>No asiste</option>
</select>

<select id="servicioMedico">
  <option value="">Servicio Médico</option>
  <option>Pérez Caldera</option>
  <option>SPA 220</option>
  <option>Tórtolas</option>
  <option>Otro</option>
</select>

<input type="text" id="otroServicio" placeholder="Especificar servicio" style="display:none;">

    </div>
  </div>

  <!-- 🏥 PACIENTES -->
<div class="bloque">
  <h3>🏥 Atención</h3>

  <div class="grid">
    <input type="number" id="pacientes" placeholder="Cantidad de pacientes">
    
    <select id="existeAtencion">
      <option value="">¿Existe atención?</option>
      <option value="SI">Sí</option>
      <option value="NO">No</option>
    </select>

    <input type="text" id="tipoAtencion" placeholder="Tipo de atención">
    <input type="text" id="clave" placeholder="Clave de atención">
    <input type="text" id="pue" placeholder="PUE">
  </div>

  <!-- ✅ Servicio Médico -->
  <input type="text" id="servicioMedico" placeholder="Servicio Médico que asiste">

  <textarea id="descPue" placeholder="Descripción PUE"></textarea>
</div>

  <!-- 🔐 CIERRE -->
  <div class="bloque">
    <h3>🔐 Cierre</h3>

    <div class="grid">
      <input type="text" id="anexo3" placeholder="Anexo 3">
      <input type="text" id="operador" placeholder="Operador">
    </div>
  </div>

  <button type="submit" class="btnGuardar">💾 Guardar Parte</button>

</form>


<script src="formulario.js"></script>

</body>
</html>
