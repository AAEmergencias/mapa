<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>AA Emergencias - Login</title>

  <link
    rel="stylesheet"
    href="login.css">

</head>

<body>

  <div class="login-container">

    <h1>🚒 AA Emergencias</h1>

    <input

    <input
      type="password"
      id="password"
      placeholder="Contraseña">

    <button id="btnLogin">
      Ingresar
    </button>

    <div id="mensaje"></div>

  </div>

  <script
    type="module"
    src="login.js">
  </script>

</body>

</html>
