<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Bitácora Operacional
    </title>

    <link rel="stylesheet" href="auditoria.css">

</head>

<body>

    <div id="encabezadoImpresion">

    <h2>
        Central de Emergencias Cóndor
    </h2>

    <p id="fechaImpresion"></p>

    <p id="filtroImpresion"></p>

</div>

    <div id="cabeceraBitacora">

    <img
        src="logo.png"
        id="logoBitacora">

    <div>

        <h1>
            📋 Bitácora Operacional
        </h1>

    </div>

</div>

    <input
    type="text"
    id="buscadorAuditoria"
    placeholder="🔍 Buscar en la bitácora...">

    <div id="filtrosFecha">

  <select id="filtroAnio">

    <option value="">
      📅 Todos los años
    </option>

  </select>

  <select id="filtroMes">

    <option value="">
      📆 Todos los meses
    </option>

    <option value="1">Enero</option>
    <option value="2">Febrero</option>
    <option value="3">Marzo</option>
    <option value="4">Abril</option>
    <option value="5">Mayo</option>
    <option value="6">Junio</option>
    <option value="7">Julio</option>
    <option value="8">Agosto</option>
    <option value="9">Septiembre</option>
    <option value="10">Octubre</option>
    <option value="11">Noviembre</option>
    <option value="12">Diciembre</option>

  </select>

</div>

    <div id="filtrosAuditoria">

    <button class="filtroBtn" data-filtro="todos">
        Todas
    </button>

    <button class="filtroBtn" data-filtro="Emergencia Creada">
        🚨 Emergencias
    </button>

    <button class="filtroBtn" data-filtro="Cambio Estado Unidad">
        🚒 Estados
    </button>

    <button class="filtroBtn" data-filtro="Traslado Registrado">
        🚑 Traslados
    </button>

    <button class="filtroBtn" data-filtro="Emergencia Finalizada">
        ✅ Finalizadas
    </button>

</div>

    <button id="btnImprimirAuditoria">

    🖨️ Imprimir Bitácora

</button>

    <button id="btnLimpiarBitacora"
        style="
          margin-left:8px;
          background:#444;
          color:#aaa;
          border:none;
          padding:6px 10px;
          border-radius:6px;
          cursor:pointer;
          font-size:11px;">
  ⚙
</button>

    <table id="tablaAuditoria">

        <thead>

            <tr>

                <th>Fecha</th>

                <th>Hora</th>

                <th>Usuario</th>

                <th>Acción</th>

                <th>Detalle</th>

            </tr>

        </thead>

        <tbody id="listaAuditoria">

        </tbody>

    </table>

    <div id="paginacionAuditoria">

    <button id="btnAnterior">
        ◀ Anterior
    </button>

    <span id="paginaActual">
        Página 1 de 1
    </span>

    <button id="btnSiguiente">
        Siguiente ▶
    </button>

</div>

    <script
        type="module"
        src="auditoria.js">
    </script>

</body>

</html>
