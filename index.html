<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Central Emergencias</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<!-- 🔍 BUSCADOR -->
<input id="search" placeholder="Buscar ubicación..." />

<!-- 🚒 ESTADO DEL MATERIAL -->
<div id="dispatchPanel">
  <div id="dispatchHeader">
    <h3>🚒 Estado del Material</h3>
    <button id="toggleDispatch">–</button>
  </div>

  <div id="dispatchContent">
    <div id="listaUnidades"></div>
  </div>
</div>

<!-- 🚨 EMERGENCIAS ACTIVAS (LISTA SIMPLE) -->
<div id="panelEmergencias">
  <h3>🚨 Emergencias Activas</h3>
  <div id="listaEmergencias"></div>
</div>

<!-- 🔴  Estados -->
<div id="menuEstados">

  <h3>🚑 Estado Unidad</h3>

  <div id="listaEstados"></div>

</div>

<!-- 🔴 PANEL PROFESIONAL EMERGENCIA ACTIVA -->
<div id="panelActivo">

  <div id="headerPanel">
    🚨 Emergencia Activa
    <div>
      <button id="minPanel">–</button>
    </div>
  </div>

  <div id="contenidoPanel">

    <div class="seccion">
      <b>Datos generales</b><br>
      Tipo: <span id="pTipo"></span><br>
      Subtipo: <span id="pSubtipo"></span><br>
      Ubicación: <span id="pUbicacion"></span><br>
    </div>

    <div class="seccion">
      🚑 Unidades asignadas:
      <div id="pUnidades"></div>
    </div>

    <div class="seccion">
      📝 Notas:
      <textarea id="pNotas"></textarea>
    </div>

    <button id="btnFinalizar">Finalizar Emergencia</button>

  </div>

</div>

<!-- ✅ BOTÓN FLOTANTE -->
<button id="btnNuevo">+</button>

<!-- ✅ OVERLAY -->
<div id="overlay"></div>

<!-- ✅ MODAL CREAR EMERGENCIA -->
<div id="modalEmergencia">

  <h2>🚨 Nueva Emergencia</h2>

  <label>Tipo de Emergencia</label>
  <select id="tipo">
    <option>Seleccione tipo...</option>
    <option>Incendio</option>
    <option>Accidente</option>
    <option>Rescate</option>
  </select>

  <label>Subtipo</label>
  <select id="subtipo">
    <option>Seleccione subtipo...</option>
    <option>Estructural</option>
    <option>Vehicular</option>
    <option>Industrial</option>
  </select>

  <label>📍 Ubicación principal</label>
  <input id="ubicacion" readonly placeholder="Seleccione ubicación">

  <label>Ubicación exacta / referencia</label>
  <input id="referencia" placeholder="Ej: Km 4.2, Portal 2">

  <label>Notas</label>
  <textarea id="notas" placeholder="Detalles adicionales..."></textarea>

  <button id="crear">Crear Emergencia</button>
  <button id="cerrar">Cancelar</button>

</div>

<!-- 🗺️ MAPA -->
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/@tmcw/togeojson@4.1.0/dist/togeojson.umd.js"></script>
<script src="script.js"></script>

</body>
</html>
