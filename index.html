<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mapa KML</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/0; }
    #map { height: 100vh; }

    #search {
      position: absolute;
      top: 15px;
      left: 60px;
      z-index: 1000;

      width: 260px;
      padding: 10px;

      border-radius: 10px;
      border: none;

      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>

<input id="search" placeholder="Buscar ubicación..." />
<div id="map"></div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet/dist/leaft>

<!-- toGeoJSON correctamente -->
<script src="https://unpkg.com/@tmcw/togeojson@4.1.0/dist/togeojson.umd.js"></script>

<script>

// Crear mapa
var map = L.map('map').setView([-33.45, -70.66], 10);

// Base
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom: 18
}).addTo(map);

var lugares = [];

// ⚠️ IMPORTANTE: CAMBIA ESTE NOMBRE
fetch('mapa.kml')
  .then(res => res.text())
  .then(kmlText => {

    var parser = new DOMParser();
    var kml = parser.parseFromString(kmlText, "text/xml");

    var geojson = toGeoJSON.kml(kml);

    var layer = L.geoJSON(geojson, {
      onEachFeature: function (feature, layer) {

        let nombre = feature.properties.name || "Sin nombre";

        layer.bindPopup("<b>" + nombre + "</b>");

        let coords;

        if (layer.getLatLng) {
          coords = layer.getLatLng();
        } else {
          coords = layer.getBounds().getCenter();
        }

        lugares.push({
          nombre,
          coords,
          layer
        });

      }
    }).addTo(map);

    map.fitBounds(layer.getBounds());

  })
  .catch(err => {
    console.error("Error cargando KML:", err);
    alert("No se pudo cargar el KML");
  });

</script>

</body>
</html>
