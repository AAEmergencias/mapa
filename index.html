<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Central Emergencias</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<!-- 🔍 BUSCADOR -->
<div id="barraSuperior">

  <div id="titulo">
    🚨 Central Emergencias
  </div>

  <input id="search" placeholder="Buscar ubicación..." />

  <div id="contenedorEmergencias"></div>

</div>

<!-- 🚒 PANEL LATERAL -->
<div id="dispatchPanel">

  <div id="dispatchHeader">
    🚒 Estado del Material
  </div>
  <button id="exportar">📊 Exportar Historial</button>

  <div id="listaUnidades"></div>

</div>

<!-- ✅ MODAL ESTADOS -->
<div id="modalEstados">

  <div id="modalContenido">

    <h3>🚑 Central Monitoreo</h3>

    <div id="listaEstadosModal"></div>

    <button id="cerrarEstados" class="btn-rojo">Cerrar</button>

  </div>

</div>
  
<!-- ✅ BOTÓN FLOTANTE -->
<button id="btnNuevo">+</button>

<!-- ✅ OVERLAY -->
<div id="overlay"></div>

<!-- ✅ MODAL CREAR EMERGENCIA -->
<div id="modalEmergencia">

  <h2>🚨 Nueva Emergencia</h2>

  <label>Tipo de Emergencia</label>
  <select id="tipo">
    <option>Seleccione tipo...</option>
    <option>Incendio</option>
    <option>Vehicular</option>
    <option>Rescate</option>
    <option>Medico</option>
    <option>Hazmat</option>
    <option>Simulacros</option>
    <option>Sísmico</option>
    <option>Meteorologico</option>
    <option>Geológico</option>
    <option>Ambiental</option>
    <option>Otros</option>
  </select>

  <label>Subtipo</label>
  <select id="subtipo">
    <option>Seleccione subtipo...</option>
  </select>

  <label>📍 Ubicación principal</label>
  <input id="ubicacion" readonly placeholder="Seleccione ubicación">

  <label>Ubicación exacta / referencia</label>
  <input id="referencia" placeholder="Ej: Km 4.2, Portal 2">

  <label>Notas</label>
  <textarea id="notas" placeholder="Detalles adicionales..."></textarea>

  <button id="crear">Crear Emergencia</button>
  <button id="cerrar">Cancelar</button>

</div>

  <!-- ✅ CONTENEDOR DE EMERGENCIAS -->
<div id="contenedorEmergencias"></div>

<!-- 🗺️ MAPA -->
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/@tmcw/togeojson@4.1.0/dist/togeojson.umd.js"></script>
<script src="script.js"></script>

</body>
</html>
