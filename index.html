<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mapa</title>

  <!-- ✅ Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { margin: 0; }
    #map { height: 100vh; }

    #search {
      position: absolute;
      top: 15px;
      left: 60px;
      z-index: 1000;
      padding: 8px;
    }
  </style>
</head>

<body>

<input id="search" placeholder="Buscar ubicación..." />
<div id="map"></div>

<!-- ✅ Leaflet JS (CLAVE) -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- ✅ toGeoJSON -->
<script src="https://unpkg.com/@tmcw/togeojson@4.1.0/dist/togeojson.umd.js"></script>

<script>

// MAPA
var map = L.map('map').setView([-33.45, -70.66], 10);

// CAPA BASE
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom: 18
}).addTo(map);

// CARGAR KML
fetch('mapa.kml')   // 🔁 cámbialo si NO renombraste
  .then(res => res.text())
  .then(kmlText => {

    var parser = new DOMParser();
    var kml = parser.parseFromString(kmlText, "text/xml");

    var geojson = toGeoJSON.kml(kml);

    var layer = L.geoJSON(geojson).addTo(map);

    map.fitBounds(layer.getBounds());
  });

</script>

</body>
</html>
