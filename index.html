<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Central Emergencias</title>

  <!-- ✅ Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <!-- ✅ Tu CSS -->
  <link rel="stylesheet" href="style.css"/>

</head>

<body>

<!-- 🔍 BUSCADOR -->
<input id="search" placeholder="Buscar ubicación..." />

<!-- 📂 PANEL DE CAPAS -->
<div id="panel">
  <h3>Capas</h3>
  <div id="listaCapas"></div>
</div>

<!-- 🚒 PANEL DE DESPACHO -->
<div id="dispatchPanel">

  <div id="dispatchHeader">
    <h3>🚒 Despacho</h3>
    <button id="toggleDispatch">–</button>
  </div>

  <div id="dispatchContent">

    <!-- UNIDADES -->
    <div id="listaUnidades"></div>

    <!-- INCIDENTES -->
    <div id="listaIncidentes"></div>

  </div>

</div>

  <div id="crearEmergencia">
  <h3>🚨 Crear Emergencia</h3>

  <select id="tipo">
    <option>Incendio</option>
    <option>Accidente</option>
    <option>Rescate</option>
  </select>

  <select id="subtipo">
    <option>Estructural</option>
    <option>Vehicular</option>
    <option>Industrial</option>
  </select>

  <input id="ubicacionTxt" placeholder="Ubicación"/>

  <select id="unidadSelect"></select>

  <button id="btnDespachar">Despachar</button>
</div>
  
<!-- 🗺️ MAPA -->
<div id="map"></div>

<!-- ✅ Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- ✅ toGeoJSON -->
<script src="https://unpkg.com/@tmcw/togeojson@4.1.0/dist/togeojson.umd.js"></script>

<!-- ✅ Tu script principal -->
<script src="script.js"></script>

</body>
</html>
