<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>
  <link rel="stylesheet" href="admin.css">


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>

<body>

<header>
  📊 Panel Administrador
  <button onclick="window.close()">⬅ Volver</button>
</header>

<div class="container">

<!-- ✅ KPIs -->
<div class="grid">

  <div class="card">
    <h3>Total Emergencias</h3>
    <div id="total"></div>
  </div>

  <div class="card">
    <h3>Últimos 15 días</h3>
    <div id="ultimosCount"></div>
  </div>

  <div class="card">
    <h3>Unidades utilizadas</h3>
    <div id="totalUnidades"></div>
  </div>

</div>

  <div class="seccion">
  <h3>📋 Partes Cerrados</h3>
  <div id="partes"></div>
</div>

<!-- ✅ GRÁFICOS -->
<div class="seccion">
  <h3>📈 Emergencias por Tipo</h3>
  <canvas id="graficoTipos"></canvas>
</div>

<!-- ✅ BITÁCORA -->
<div class="seccion">
  <h3>📅 Bitácora últimos 15 días</h3>
  <div id="ultimos15"></div>
</div>

<!-- ✅ HISTORIAL -->
<div class="seccion">
  <h3>📂 Historial completo</h3>
  <div id="historial"></div>
</div>

  <button id="resetBtn">⚙️ Reset</button>

</div>
  
  <script src="admin.js"></script>
  
</body>
</html>
