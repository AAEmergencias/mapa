<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>
  <link rel="stylesheet" href="admin.css">


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>

<body>

<header>

  <div class="filtros">

  <select id="filtroMes">
    <option value="">Mes</option>
    <option value="01">Enero</option>
    <option value="02">Febrero</option>
    <option value="03">Marzo</option>
  </select>

  <select id="filtroAnio">
    <option value="">Año</option>
    <option>2024</option>
    <option>2025</option>
    <option>2026</option>
  </select>

    <div class="acciones">

  <button onclick="verBrigada()">🚒 Brigada</button>

  <button onclick="verMedico()">🚑 Servicio Médico</button>

</div>

</div>
  
  📊 Panel Administrador
  <div>
    <button id="actualizar">🔄 Actualizar</button>
    <button onclick="window.close()">⬅ Volver</button>
  </div>
</header>

<div class="container">

<!-- ✅ KPIs -->
<div class="grid">

  <div class="card">
    <h3>Total Emergencias</h3>
    <div id="total"></div>
  </div>

  <div class="card">
    <h3>Últimos 15 días</h3>
    <div id="ultimosCount"></div>
  </div>

  <div class="card">
    <h3>Partes Cerrados</h3>
<div id="totalPartes"></div>
  </div>

</div>

<!-- ✅ GRÁFICOS -->

<div class="gridGraficos">

  <div class="card">
    <h4>📊 Por Mes</h4>
    <canvas id="graficoMes"></canvas>
  </div>

  <div class="card">
    <h4>🏭 Por Faena</h4>
    <canvas id="graficoFaena"></canvas>
  </div>

  <div class="card">
    <h4>🚒 Por Tipo</h4>
    <canvas id="graficoTipo"></canvas>
  </div>

  <div class="card">
    <h4>📂 Por Subtipo</h4>
    <canvas id="graficoSubtipo"></canvas>
  </div>

  <div class="card">
    <h4>🏢 Empresas</h4>
    <canvas id="graficoEmpresa"></canvas>
  </div>

  <div class="card full">
    <h4>⚠️ PUE</h4>
    <canvas id="graficoPUE"></canvas>
  </div>

</div>


<!-- ✅ BITÁCORA -->
<div class="seccion">
  <h3>📅 Bitácora últimos 15 días</h3>
  <div id="ultimos15"></div>
</div>

<!-- ✅ HISTORIAL -->
<div class="seccion">
  <h3>📂 Historial completo</h3>
  <div id="historial"></div>
</div>

  <div class="seccion">
  <h3 onclick="togglePartes()" style="cursor:pointer;">
    📋 Partes Cerrados (click para abrir)
  </h3>

  <div id="partes" style="display:none;"></div>
</div>

  <button id="exportarPartes">📄 Exportar Partes</button>

  <button id="resetBtn">⚙️ Reset</button>

</div>
  
  <script src="admin.js"></script>
  
</body>
</html>
