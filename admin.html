<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #1e293b;
  color: white;
}

header {
  background: #0f172a;
  padding: 15px;
  display: flex;
  justify-content: space-between;
}

.container {
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 20px;
}

.card {
  background: #334155;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}

.seccion {
  background: #334155;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.item {
  border-bottom: 1px solid #475569;
  padding: 8px;
  font-size: 13px;
}

canvas {
  background: white;
  border-radius: 10px;
  padding: 10px;
}
</style>
</head>

<body>

<header>
  📊 Panel Administrador
  <button onclick="window.close()">⬅ Volver</button>
</header>

<div class="container">

<!-- ✅ KPIs -->
<div class="grid">

  <div class="card">
    <h3>Total Emergencias</h3>
    <div id="total"></div>
  </div>

  <div class="card">
    <h3>Últimos 15 días</h3>
    <div id="ultimosCount"></div>
  </div>

  <div class="card">
    <h3>Unidades utilizadas</h3>
    <div id="totalUnidades"></div>
  </div>

</div>

<!-- ✅ GRÁFICOS -->
<div class="seccion">
  <h3>📈 Emergencias por Tipo</h3>
  <canvas id="graficoTipos"></canvas>
</div>

<!-- ✅ BITÁCORA -->
<div class="seccion">
  <h3>📅 Bitácora últimos 15 días</h3>
  <div id="ultimos15"></div>
</div>

<!-- ✅ HISTORIAL -->
<div class="seccion">
  <h3>📂 Historial completo</h3>
  <div id="historial"></div>
</div>

</div>

<script>

// ✅ cargar historial
let historial = JSON.parse(localStorage.getItem("historialEmergencias")) || [];

// ✅ KPIs
document.getElementById("total").innerText = historial.length;

// ✅ últimos 15 días
let hoy = new Date();

let ultimos15 = historial.filter(e => {
  let partes = e.fecha.split("/");
  let fecha = new Date(partes[2], partes[1]-1, partes[0]);
  let diff = (hoy - fecha) / (1000*60*60*24);
  return diff <= 15;
});

document.getElementById("ultimosCount").innerText = ultimos15.length;

// ✅ contar unidades
let unidadesSet = new Set();

historial.forEach(e => {
  e.unidades.forEach(u => unidadesSet.add(u));
});

document.getElementById("totalUnidades").innerText = unidadesSet.size;

// ✅ gráfico por tipo
let conteoTipos = {};

historial.forEach(e => {
  conteoTipos[e.tipo] = (conteoTipos[e.tipo] || 0) + 1;
});

new Chart(document.getElementById("graficoTipos"), {
  type: "bar",
  data: {
    labels: Object.keys(conteoTipos),
    datasets: [{
      label: "Emergencias",
      data: Object.values(conteoTipos),
      backgroundColor: "#ef4444"
    }]
  }
});

// ✅ render últimos 15
let div15 = document.getElementById("ultimos15");

ultimos15.slice().reverse().forEach(e => {
  let div = document.createElement("div");
  div.className = "item";

  div.innerHTML = `
    #${e.id} - ${e.tipo} (${e.subtipo})<br>
    📍 ${e.ubicacion}<br>
    🕒 ${e.fecha}
  `;

  div15.appendChild(div);
});

// ✅ historial completo
let divHist = document.getElementById("historial");

historial.slice().reverse().forEach(e => {
  let div = document.createElement("div");
  div.className = "item";

  div.innerHTML = `
    #${e.id} - ${e.tipo}<br>
    📍 ${e.ubicacion}<br>
    📅 ${e.fecha}
  `;

  divHist.appendChild(div);
});

</script>

  <script src="admin.js"></script>
  
</body>
</html>
