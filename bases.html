<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Gestión de Bases
    </title>

    <link
        rel="stylesheet"
        href="unidades.css">

</head>

<body>

    <h1>
    🏠 Gestión de Bases
</h1>

    <button id="btnNuevaUnidad">

    ➕ Nueva Base

</button>

    <div id="modalUnidad">

    <div id="modalUnidadContenido">

<h2 id="tituloModalUnidad">

    🚒 Nueva Unidad

</h2>

<p id="subtituloUnidad"></p>
   <label>Código</label>

<label>Nombre Base</label>

<input
    id="nombreBase"
    placeholder="Ej: Brigada Mina"
>

   <label>Nombre</label>

<label>Latitud</label>

<input
    id="latitudBase"
    placeholder="-33.159893"
>

<label>Base</label>

<label>Longitud</label>

<input
    id="longitudBase"
    placeholder="-70.293627"
>

        <label id="labelActivaUnidad">

    <input
        type="checkbox"
        id="activaUnidad"
        checked
    >

    Base Activa

</label>

    <button id="guardarUnidad">

        💾 Guardar Unidad

    </button>

    <button id="cerrarModalUnidad">

        Cerrar

    </button>

</div>

</div>

<table id="tablaUnidades">

    <thead>

            <tr>

              <th>Nombre</th>

              <th>Latitud</th>

              <th>Longitud</th>

              <th>Activa</th>

              <th>Acciones</th>

            </tr>

        </thead>

        <tbody id="listaUnidades">

        </tbody>

    </table>

    <script
        type="module"
        src="bases.js">
    </script>

</body>

</html>
