<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Centro de Gestión de Usuarios</title>

<link rel="stylesheet" href="usuarios.css">

</head>

<body>

    <h1>
        👑 Centro de Gestión de Usuarios
    </h1>

    <button id="btnNuevoUsuario">

    ➕ Nuevo Usuario

</button>


   <table id="tablaUsuarios">

    <thead>

        <tr>

            <th>Nombre</th>

            <th>Correo</th>

            <th>Rol</th>

            <th>Turno</th>

            <th>Estado</th>

            <th>Acciones</th>

        </tr>

    </thead>

    <tbody id="listaUsuarios">

    </tbody>

</table>

<script
    type="module"
    src="usuarios.js">
</script>

    <div id="modalUsuario">

    <div id="contenidoModal">

        <h2>
            👤 Usuario
        </h2>

        <div id="detalleUsuario">

        </div>

        <br>

        <button id="cerrarModal">

            Cerrar

        </button>

    </div>

</div>

    <div id="modalNuevoUsuario">

    <div id="contenidoNuevoUsuario">

        <h2>
            ➕ Nuevo Usuario
        </h2>

        <input
            type="text"
            id="nuevoNombre"
            placeholder="Nombre completo">

        <br><br>

        <input
            type="email"
            id="nuevoCorreo"
            placeholder="Correo">

        <br><br>

        <select id="nuevoRol">

            <option value="operador">
                Operador
            </option>

            <option value="admin">
                Admin
            </option>

        </select>

        <br><br>

        <select id="nuevoTurno">

            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>

        </select>

        <br><br>

        <input
            type="password"
            id="nuevoPassword"
            placeholder="Contraseña temporal">

        <br><br>

        <button id="crearUsuario">

            ✅ Crear Usuario

        </button>

        <button id="cerrarNuevoUsuario">

            Cancelar

        </button>

    </div>

</div>


</body>

</html>
